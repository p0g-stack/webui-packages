name: share_plus_webui
description: WebUI implementation of share_plus. Shares text, links and a file through the Android share sheet via webui-termux-api's Share method, since the manager WebView has no Web Share API.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

flutter:
  plugin:
    implements: share_plus
    platforms:
      web:
        pluginClass: SharePlusWebUi
        fileName: share_plus_webui.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  share_plus: ^13.3.0
  share_plus_platform_interface: ^7.2.0
  url_launcher_platform_interface: ^2.3.2
  url_launcher_web: ^2.4.3
  url_launcher_webui:
    path: ../url_launcher_webui
  webui_app_plane:
    path: ../webui_app_plane

dev_dependencies:
  flutter_test:
    sdk: flutter
