name: webui_app_plane
description: Shared pieces of the WebUI plugins. Root commands through the flutter-webui root channel, and the client for webui-termux-api (Termux:API repackaged) with its presence check.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

executables:
  webui_termux_api:

dependencies:
  flutter_webui_client:
    git:
      url: https://github.com/p0g-stack/flutter-webui
      ref: 798548958306fb5baedf5c06a2f520c85448dba6
      path: packages/flutter_webui_client
  flutter_webui_root:
    git:
      url: https://github.com/p0g-stack/flutter-webui
      ref: 798548958306fb5baedf5c06a2f520c85448dba6
      path: packages/flutter_webui_root

dev_dependencies:
  test: ^1.25.0
