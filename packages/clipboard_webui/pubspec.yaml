name: clipboard_webui
description: Stock Flutter Clipboard on WebUI hosts. Keeps the browser clipboard where the WebView allows it and falls back to the module's app (webui-termux-api's Clipboard method), since WebView never lets a page read the clipboard.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

flutter:
  plugin:
    platforms:
      web:
        pluginClass: ClipboardWebUi
        fileName: clipboard_webui.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_webui:
    git:
      url: https://github.com/p0g-stack/flutter-webui
      ref: 74d0575a9a5851ddb879f6a16e473e1741bd9a76
      path: packages/flutter_webui
  webui_app_plane:
    path: ../webui_app_plane

dev_dependencies:
  flutter_test:
    sdk: flutter
