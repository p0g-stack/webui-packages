name: permission_handler_webui
description: WebUI implementation of permission_handler. Runtime permissions belong to the module's own app; Android's own dialog asks, and its answer is passed back unchanged.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

flutter:
  plugin:
    implements: permission_handler
    platforms:
      web:
        pluginClass: PermissionHandlerWebUi
        fileName: permission_handler_webui.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  permission_handler_platform_interface: ^4.3.0
  permission_handler_html: ^0.1.3
  webui_app_plane:
    path: ../webui_app_plane

dev_dependencies:
  flutter_test:
    sdk: flutter
