name: url_launcher_webui
description: WebUI implementation of url_launcher. Opens URLs in their Android app with `am start` as root, since a manager WebView would navigate the module page away.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

flutter:
  plugin:
    implements: url_launcher
    platforms:
      web:
        pluginClass: UrlLauncherWebUi
        fileName: url_launcher_webui.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.2
  url_launcher_web: ^2.4.3
  webui_app_plane:
    path: ../webui_app_plane

dev_dependencies:
  flutter_test:
    sdk: flutter
