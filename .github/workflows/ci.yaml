name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: dart analyze --fatal-infos packages
      - name: webui_app_plane
        run: dart test
        working-directory: packages/webui_app_plane
      - name: plugins
        run: |
          for p in file_selector path_provider url_launcher share_plus dynamic_color shared_preferences permission_handler clipboard flutter_local_notifications; do
            (cd packages/${p}_webui && flutter test) || exit 1
          done
